<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Health Tracker Beta</title><link rel="stylesheet" href="styles.css?v=1"></head>
<body><div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="brand-mark">♥</div><span>Health<br>Tracker</span></div><nav class="nav"><button class="nav-btn active">♡ <span>Health</span></button><button class="nav-btn" id="feedback-btn">✦ <span>Beta Feedback</span></button></nav><div class="sidebar-context" id="sidebar-context"></div><div class="beta-user"><strong id="user-name">Beta Tester</strong><small id="user-email">Connecting…</small><span id="sync-status" class="sync-status">Local cache</span><small id="auth-note"></small></div><button class="ghost-btn full" id="export-page">⇩ Export My Data</button></aside>
<main class="main"><section class="page active" id="page-health"></section></main>
<aside class="schedule-panel"><div class="schedule-card"><button class="schedule-head" id="schedule-toggle"><div><strong>▣ Daily Schedule</strong><span id="schedule-date"></span></div><span id="schedule-chevron">⌃</span></button><div id="schedule-summary" class="schedule-summary"></div><div id="schedule-expanded"></div><div class="schedule-actions"><button class="primary-btn" id="add-schedule-item">+ Add Schedule Item</button><button class="outline-btn" id="edit-schedule">✎ Edit Schedule</button></div><div class="roadmap">✦ <span>Your schedule is your roadmap.<br>Plan your day. Protect your time. Stay consistent.</span></div></div></aside>
</div>
<dialog id="modal"><form id="modal-form"><div class="modal-head"><div><span class="eyebrow" id="modal-eyebrow">HEALTH TRACKER</span><h2 id="modal-title">Add</h2></div><button type="button" class="dialog-x" id="modal-close">×</button></div><div id="modal-fields" class="form-grid"></div><div class="modal-actions"><button type="button" class="ghost-btn" id="modal-cancel">Cancel</button><button type="submit" class="primary-btn" id="modal-submit">Save</button></div></form></dialog>
<script src="recipes.js?v=1"></script><script src="app.js?v=1"></script></body></html>
